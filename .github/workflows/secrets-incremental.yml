name: Secrets incremental gate
on:
  pull_request:
  push:
    branches: [main, 'security/scan-gate-*']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Install official pinned scanner
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan introduced commits using trusted base policy
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$HEAD" =~ ^[a-f0-9]{40}$ ]] || exit 2
          [[ "$BASE" =~ ^[a-f0-9]{40}$ ]] || exit 2
          git fetch --no-tags origin "$HEAD"
          POLICY_RUNNER=.github/scripts/secret_scan.py
          if [[ ! -f "$POLICY_RUNNER" ]]; then
            # First deployment only: use immutable, previously validated policy blobs.
            # Never execute scripts from arbitrary pull-request HEAD.
            case "$GITHUB_REPOSITORY" in
              Geruyang/agent-skills-library) BOOTSTRAP_COMMIT=26da32831af9873b07dfeca7981d5b7509e1731c ;;
              Geruyang/agent-design-sourcebook) BOOTSTRAP_COMMIT=f5a8f3b6ced768f2e966337b606aa638d4116d25 ;;
              *) echo 'No reviewed bootstrap policy for this repository'; exit 2 ;;
            esac
            BOOTSTRAP="$RUNNER_TEMP/reviewed-bootstrap/.github"
            mkdir -p "$BOOTSTRAP/scripts" "$BOOTSTRAP/security"
            for item in scripts/secret_scan.py security/gitleaks.toml security/empty.gitleaksignore; do
              git show "$BOOTSTRAP_COMMIT:.github/$item" > "$BOOTSTRAP/$item"
            done
            POLICY_RUNNER="$BOOTSTRAP/scripts/secret_scan.py"
          fi
          if [[ "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            python "$POLICY_RUNNER" --repo . --scanner "$RUNNER_TEMP/gitleaks" --audit --output "$RUNNER_TEMP/secrets-metadata.json"
          else
            python "$POLICY_RUNNER" --repo . --scanner "$RUNNER_TEMP/gitleaks" --base "$BASE" --head "$HEAD" --output "$RUNNER_TEMP/secrets-metadata.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: secrets-incremental-metadata
          path: ${{ runner.temp }}/secrets-metadata.json
          retention-days: 7
